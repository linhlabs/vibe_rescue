<!doctype html>
<html lang="__LANG__"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibe Rescue · __TITLE__ · __HANDOFF_TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#08121d;--panel:#132536;--line:#2b4b5c;--text:#ecf7f6;--muted:#a9c3ca;--mint:#80ebd1;--amber:#ffc58a}*{box-sizing:border-box}
html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--mint);text-decoration:none}a:hover{text-decoration:underline}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(44px,6vw,82px);line-height:1.03;letter-spacing:-.045em;margin-bottom:18px}h1 em{font-style:normal;color:var(--mint)}h2{font-size:clamp(30px,3vw,46px);letter-spacing:-.03em;margin-bottom:16px}h3{font-size:19px}p{color:var(--muted)}
header{padding:70px clamp(24px,6vw,100px) 58px;background:radial-gradient(circle at 80% 15%,#1d6869 0,#143745 35%,#101f32 70%,#0b1726 100%);border-bottom:1px solid var(--line)}.eyebrow,.section-label{color:var(--mint);text-transform:uppercase;letter-spacing:.19em;font-size:11px;font-weight:800}.eyebrow{margin-bottom:23px}.hero{font-size:19px;max-width:760px}.header-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.header-links a{border:1px solid #70adab;border-radius:99px;padding:9px 15px;background:#173c45;color:#e6fffa;font-weight:650}
nav{position:sticky;top:0;z-index:10;display:flex;gap:24px;overflow:auto;padding:13px clamp(24px,6vw,100px);background:#091c2aeb;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}nav a{white-space:nowrap;color:#d4ebe9;font-size:13px;font-weight:650}main{max-width:1580px;margin:auto;padding:26px clamp(24px,6vw,100px) 90px}section{scroll-margin-top:85px;margin:55px 0 80px}.warning{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:17px 22px;background:#302c2b;border:1px solid #8a6d55;border-radius:12px}.warning span{font-size:11px;font-weight:850;color:#1e1b17;background:var(--amber);border-radius:99px;padding:5px 10px;letter-spacing:.08em}.warning strong{font-size:17px}.warning p{margin:0;flex-basis:100%;color:#e7c6aa}.section-label{margin-bottom:9px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metrics article{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px}.metrics b{display:block;font-size:36px;letter-spacing:-.04em;line-height:1.1}.metrics span{color:var(--muted);font-size:13px}.metrics .amber b{color:var(--amber)}.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.surface,.block,.journey,.control{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:21px}.surface h3{color:var(--mint)}.surface ol{margin:0;padding-left:20px}.surface li{margin:8px 0}.fingerprint{margin:18px 0;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#8ea8b3}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:13px}.block-head,.control-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.block h3{margin:0}.block code{font-size:11px;color:#acd1d7;overflow-wrap:anywhere}.block p{margin:10px 0}.fine,.block small{font-size:12px;color:#9db8c3}.leads{font-size:12px;line-height:1.8;overflow-wrap:anywhere}.edges{padding-left:18px;margin:10px 0 0;font-size:13px}.edges li{margin-top:5px}.edges span{color:var(--muted)}.journey-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:14px}.journey ol{padding-left:22px}.journey li{padding:10px 0;border-top:1px solid var(--line)}.journey li p{margin:0 0 4px;color:var(--text)}.journey small{color:var(--muted)}.unknown,.state{color:var(--amber)}.badge{font:700 11px ui-monospace,monospace;border-radius:6px;background:#256867;color:#ecfffb;padding:5px 8px}.control ul{padding-left:19px;font-size:13px}.control li{margin:5px 0}.control li span{color:var(--muted)}.control .state{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.control p:last-child{margin-bottom:0}.surface summary{cursor:pointer;font-weight:700}.surface ul{overflow-wrap:anywhere}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.overview-grid{grid-template-columns:1fr}header{padding-top:45px}}@media(max-width:560px){.metrics{grid-template-columns:1fr 1fr}.cards,.journey-grid{grid-template-columns:1fr}nav{gap:13px}.header-links a{font-size:12px}}
@media print{nav{display:none}body{background:white;color:#111}header,.surface,.block,.journey,.control{background:white;color:#111}}
</style>
__BODY__
</html>
