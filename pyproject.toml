[project]
name = "vibe-rescue"
version = "0.8.0-preview"
description = "Codebase maps, static-analysis evidence, and human-gated repository repair"
keywords = ["codebase visualization", "static analysis", "call graph", "repository audit", "agent harness", "vibe coding", "legacy code", "technical debt"]
authors = [{ name = "Nguyễn Anh Nguyên" }]
readme = "README.md"
requires-python = ">=3.11"  # tomllib (manifest.toml single source of truth)

[project.urls]
Homepage = "https://thusinh1969.github.io/vibe_rescue/"
Repository = "https://github.com/thusinh1969/vibe_rescue"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["tests/fixtures/semgrep"]
