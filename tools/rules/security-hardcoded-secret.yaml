rules:
  - id: security-hardcoded-secret
    languages: [python]
    message: "Chuỗi dạng secret/token hardcode — phải lấy từ .env, không commit"
    severity: ERROR
    patterns:
      - pattern-regex: '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (?:RSA|EC|OPENSSH) PRIVATE KEY-----)'
    metadata:
      category: security
      confidence: HIGH
