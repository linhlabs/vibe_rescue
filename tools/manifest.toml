pyan3 = { url = "https://github.com/Technologicat/pyan.git", commit = "ea91473f7dd77a269a64228a588cda9a00a57470" }
cargo_modules = { url = "https://github.com/regexident/cargo-modules.git", commit = "48455ca5961ccfc3196b5d6bd5dd3efec97374c0" }

[logic_map.packages]
pyan3 = "2.9.0"
