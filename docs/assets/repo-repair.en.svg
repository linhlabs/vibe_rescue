<text class="small" x="47" y="637">scripts/plan_check.py:129</text>
<text class="small" x="47" y="660">Allowed diff</text>
<path class="cross" d="M 640 633 L 663 633"/>
<rect class="risk" x="670" y="583" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="611">Check Scope before and after reviewer</text>
<text class="small" x="689" y="638">Out-of-scope change returns REVISE</text>
<text class="small" x="689" y="661">Malicious content in allowed files still needs reviewer scruti</text>
<path class="line" d="M 330 681 L 330 701"/>
<rect class="node" x="28" y="707" width="612" height="100" rx="11"/>
