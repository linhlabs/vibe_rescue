<text class="small" x="47" y="761">scripts/rescue_loop.py:214</text>
<text class="small" x="47" y="784">candidate_sha</text>
<path class="cross" d="M 640 757 L 663 757"/>
<rect class="risk" x="670" y="707" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="735">Probe rc and hash must match before</text>
<text class="small" x="689" y="762">Commit failure or probe mismatch returns REVISE</text>
<text class="small" x="689" y="785">A probe cannot cover every behavior</text>
<path class="line" d="M 330 805 L 330 825"/>
<rect class="node" x="28" y="831" width="612" height="100" rx="11"/>
