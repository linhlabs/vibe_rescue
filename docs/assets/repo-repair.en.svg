<text class="small" x="47" y="513">scripts/rescue_loop.py:161</text>
<text class="small" x="47" y="536">rescue/&lt;plan-id&gt; worktree</text>
<path class="cross" d="M 640 509 L 663 509"/>
<rect class="risk" x="670" y="459" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="487">Target HEAD and clean state must remain unchanged</text>
<text class="small" x="689" y="514">Worktree error returns BLOCK</text>
<text class="small" x="689" y="537">The executor has host filesystem and network privileges</text>
<path class="line" d="M 330 557 L 330 577"/>
<rect class="node" x="28" y="583" width="612" height="100" rx="11"/>
