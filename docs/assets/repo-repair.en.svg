<text class="small" x="47" y="885">scripts/rescue_loop.py:243</text>
<text class="small" x="47" y="908">Round evidence</text>
<path class="cross" d="M 640 881 L 663 881"/>
<rect class="risk" x="670" y="831" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="859">No failures, lost coverage or new findings</text>
<text class="small" x="689" y="886">Violation returns REVISE</text>
<text class="small" x="689" y="909">A scanner skipped in baseline can remain skipped</text>
<path class="line" d="M 330 929 L 330 949"/>
<rect class="node" x="28" y="955" width="612" height="100" rx="11"/>
