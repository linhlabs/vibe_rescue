<text class="small" x="47" y="265">scripts/rescue_loop.py:75</text>
<text class="small" x="47" y="288">loop.json round 0</text>
<path class="cross" d="M 640 261 L 663 261"/>
<rect class="risk" x="670" y="211" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="239">Baseline SHA must match HEAD</text>
<text class="small" x="689" y="266">Violation returns BLOCK</text>
<text class="small" x="689" y="289">_tracked_clean does not detect untracked target files</text>
<path class="line" d="M 330 309 L 330 329"/>
<rect class="node" x="28" y="335" width="612" height="100" rx="11"/>
