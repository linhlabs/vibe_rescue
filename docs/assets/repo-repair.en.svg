<text class="small" x="47" y="389">scripts/guards.py:42</text>
<text class="small" x="47" y="412">probe_before</text>
<path class="cross" d="M 640 385 L 663 385"/>
<rect class="risk" x="670" y="335" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="363">Every rc must be 0</text>
<text class="small" x="689" y="390">A failing baseline probe returns BLOCK</text>
<text class="small" x="689" y="413">Output hashes are sensitive to nondeterministic output</text>
<path class="line" d="M 330 433 L 330 453"/>
<rect class="node" x="28" y="459" width="612" height="100" rx="11"/>
