<text x="30" y="43" class="heading">04 · PLAN, candidate, reviewer and rollback</text>
<text x="30" y="70" class="label">SOURCE / CALL</text>
<text x="683" y="70" class="label">GUARD / FAILURE / OUTPUT</text>
<rect class="node" x="28" y="87" width="612" height="100" rx="11"/>
<text class="title" x="47" y="115">01  advisor.md → plan_check.check_plan</text>
<text class="small" x="47" y="141">scripts/plan_check.py:81</text>
<text class="small" x="47" y="164">Valid PLAN-*.md</text>
<path class="cross" d="M 640 137 L 663 137"/>
<rect class="risk" x="670" y="87" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="115">Return 2 if the plan is missing or mismatched</text>
<text class="small" x="689" y="142">An invalid plan cannot be accepted</text>
<text class="small" x="689" y="165">The checker cannot prove that Verification steps are sufficien</text>
<path class="line" d="M 330 185 L 330 205"/>
<rect class="node" x="28" y="211" width="612" height="100" rx="11"/>
