<text class="small" x="47" y="1009">scripts/rescue_loop.py:38</text>
<text class="small" x="47" y="1032">APPROVE/REVISE/BLOCK</text>
<path class="cross" d="M 640 1005 L 663 1005"/>
<rect class="risk" x="670" y="955" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="983">Candidate must be clean; stale verdict removed</text>
<text class="small" x="689" y="1010">Unknown/REVISE repeats until max_rounds</text>
<text class="small" x="689" y="1033">A text verdict does not prove the reviewer ran tests</text>
<path class="line" d="M 330 1053 L 330 1073"/>
<rect class="node" x="28" y="1079" width="612" height="100" rx="11"/>
<text class="title" x="47" y="1107">09  owner merge → postmerge probe</text>
<text class="small" x="47" y="1133">scripts/rescue_voyage.py:350</text>
<text class="small" x="47" y="1156">CHANGES.log and REVERT.md</text>
<path class="cross" d="M 640 1129 L 663 1129"/>
<rect class="risk" x="670" y="1079" width="480" height="100" rx="11"/>
<text class="guard" x="689" y="1107">Target HEAD and candidate SHA unchanged</text>
<text class="small" x="689" y="1134">Probe mismatch auto-reverts if HEAD is clean</text>
