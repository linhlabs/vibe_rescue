<text class="small" x="689" y="886">Reject giữ/bỏ candidate, không merge</text>
<text class="small" x="689" y="909">Các subprocess có quyền host; worktree không sandbox</text>
<path class="line" d="M 330 929 L 330 949"/>
<rect class="node" x="28" y="955" width="612" height="100" rx="11"/>
