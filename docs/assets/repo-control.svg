<text class="small" x="689" y="762">Reject/3 lần lỗi dừng</text>
<text class="small" x="689" y="785">Approval file nằm cạnh evidence; không có chữ ký</text>
<path class="line" d="M 330 805 L 330 825"/>
<rect class="node" x="28" y="831" width="612" height="100" rx="11"/>
